name: Build SocialPilot Android APK
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: socialpilot-mobile-share/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build release APK
        run: gradle --no-daemon assembleRelease
      - name: Publish APK into repository
        working-directory: .
        run: |
          mkdir -p downloads
          cp socialpilot-mobile-share/android/app/build/outputs/apk/release/app-release.apk downloads/SocialPilotAI-Android.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/SocialPilotAI-Android.apk
          git diff --cached --quiet || git commit -m "Publish latest Android APK [skip ci]"
          git push
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: socialpilot-android-share-apk
          path: socialpilot-mobile-share/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
